<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | Cupid</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="static/sandbox.css?v=1764549900">
</head>
<body>
<nav class="sidebar">
    <div class="brand-box">
        <a href="/" class="app-logo">Cupid</a>
        <span class="slogan">Love First,<br>Know Later</span>
        <span class="beta-badge">BETA</span>
    </div>
    <div class="nav-menu">
        <a href="/home" class="nav-item ">
            <span class="nav-icon"></span> Home
        </a>
        <a href="/discovery" class="nav-item ">
            <span class="nav-icon"></span> Discovery
        </a>
        <a href="/sandbox" class="nav-item ">
            <span class="nav-icon"></span> Sandbox
        </a>
    </div>
    <div class="sidebar-footer">
        <a href="/user_settings" class="nav-item active">
            <span class="nav-icon"></span> Settings
        </a>
    </div>
</nav>




<div class="settings-container">
    <header class="settings-header">
        <h1>Your Profile</h1>
        <p>Manage your persona and preferences</p>
    </header>

    <form id="settings-form" class="glass-panel settings-form" enctype="multipart/form-data">
        
        <!-- Avatar Section -->
        <div class="settings-section center-text">
            <div class="current-avatar" id="avatar-preview">
                <img id="avatar-img" src="" alt="Avatar" style="width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid white;box-shadow:0 5px 15px rgba(0,0,0,0.1);">
            </div>
            <label for="avatar-upload" class="btn-sample" style="margin-top:15px;cursor:pointer;display:inline-block;">
                <i class="fas fa-camera"></i> Upload Photo
            </label>
            <input type="file" id="avatar-upload" name="avatar" accept="image/*" style="display:none;" onchange="previewAvatar(this)">
        </div>

        <!-- Info Section -->
        <div class="settings-section">
            <h3>Basic Info</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>Nickname</label>
                    <input type="text" id="nickname" name="nickname" placeholder="Your name" required>
                </div>
                <div class="form-group">
                    <label>Age</label>
                    <input type="number" id="age" name="age" placeholder="25" min="18" max="100" required>
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="female">Female</option>
                        <option value="male">Male</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Occupation</label>
                    <input type="text" id="occupation" name="occupation" placeholder="e.g. Artist, Engineer">
                </div>
            </div>
        </div>

        <!-- Bio Section -->
        <div class="settings-section">
            <h3>Personality & Bio</h3>
            <div class="form-group">
                <label>About You</label>
                <textarea id="bio" name="bio" rows="4" placeholder="Describe your personality, hobbies, and what you're looking for..."></textarea>
            </div>
            <div class="form-group">
                <label>Interests</label>
                <input type="text" id="interests" name="interests" placeholder="Jazz, Coding, Hiking...">
            </div>
        </div>

        <!-- Actions -->
        <div class="form-actions">
            <button type="submit" class="btn-create">Save Changes</button>
            <a href="/logout" class="btn-sample" style="color: #e53e3e; border-color: #e53e3e;">Log Out</a>
        </div>

    </form>
</div>

<style>
    .settings-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 40px;
    }
    .settings-header {
        text-align: center;
        margin-bottom: 40px;
    }
    .settings-header h1 {
        font-size: 2.5rem;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .settings-form.glass-panel {
        background: rgba(255, 255, 255, 0.6) !important;
        backdrop-filter: blur(20px) !important;
        -webkit-backdrop-filter: blur(20px) !important;
        border: 1px solid rgba(255, 255, 255, 0.8) !important;
        box-shadow: 0 20px 50px rgba(0,0,0,0.05) !important;
        border-radius: 30px;
        padding: 40px;
    }
    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }
    .settings-section {
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    .settings-section:last-child {
        border-bottom: none;
    }
    .center-text { text-align: center; }
    .form-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 30px;
    }
</style>

<script>
    // Load current user info
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            const res = await fetch('/get_user_info');
            const data = await res.json();
            if(data.information) {
                const info = data.information;
                document.getElementById('nickname').value = info.nickname || '';
                document.getElementById('age').value = info.age || '';
                document.getElementById('gender').value = info.gender || 'female';
                document.getElementById('occupation').value = info.occupation || '';
                document.getElementById('bio').value = info.bio || '';
                document.getElementById('interests').value = info.interests || '';
                
                // Avatar
                if (info.avatar) {
                    document.getElementById('avatar-img').src = '/' + info.avatar;
                }
            }
        } catch (e) {
            console.error("Failed to load user info", e);
        }
    });

    // Avatar preview
    function previewAvatar(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('avatar-img').src = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    // Submit form
    document.getElementById('settings-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const formData = new FormData(e.target);
        
        try {
            const res = await fetch('/update_user_info', {
                method: 'POST',
                body: formData
            });
            
            const result = await res.json();
            if (result.status === 'ok') {
                alert('Profile updated successfully!');
                window.location.reload();
            } else {
                alert('Failed to update: ' + (result.message || 'Unknown error'));
            }
        } catch (e) {
            console.error(e);
            alert('Network error. Please try again.');
        }
    });
</script>
</body>
</html>
