<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery | Cupid</title>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Reuse Premium Sandbox Styles for consistency -->
  <link rel="stylesheet" href="static/sandbox.css?v=1764549900"> 
  <link rel="stylesheet" href="static/discovery.css?v=1764549900">
</head>
<body>
<nav class="sidebar">
    <div class="brand-box">
        <a href="/" class="app-logo">Cupid</a>
        <span class="slogan">Love First,<br>Know Later</span>
        <span class="beta-badge">BETA</span>
    </div>
    <div class="nav-menu">
        <a href="/home" class="nav-item ">
            <span class="nav-icon"></span> Home
        </a>
        <a href="/discovery" class="nav-item active">
            <span class="nav-icon"></span> Discovery
        </a>
        <a href="/sandbox" class="nav-item ">
            <span class="nav-icon"></span> Sandbox
        </a>
    </div>
    <div class="sidebar-footer">
        <a href="/user_settings" class="nav-item ">
            <span class="nav-icon"></span> Settings
        </a>
    </div>
</nav>






  <!-- Shared Premium Header -->
  

  <div class="radar-container">
      <!-- Radar Center (Input) -->
      <div class="radar-core">
          <div class="radar-waves">
              <div class="wave w1"></div>
              <div class="wave w2"></div>
              <div class="wave w3"></div>
          </div>
          
          <div class="soul-input-glass">
               <input type="text" id="soul-input" placeholder="Send a signal... (e.g. 'I love jazz')" autocomplete="off">
               <button id="btn-scan" onclick="startScanning()">
                   <i class="fas fa-search-location"></i>
               </button>
          </div>
      </div>

      <!-- Detected Agents (Injected by JS) -->
      <div id="radar-field">
          <!-- Agents will pop up here -->
      </div>
  </div>

  <!-- Glass Modal -->
  <div id="agent-modal" class="agent-modal">
      <div class="glass-panel modal-panel">
          <button class="close-modal" onclick="closeModal()">&times;</button>
          <div class="modal-body" id="modal-body"></div>
      </div>
  </div>

  <script src="static/discovery.js?v=1764549900"></script>
</body>
</html>
