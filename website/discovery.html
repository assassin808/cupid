            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>

  <!-- Shared Premium Header -->
  

  <div class="radar-container">
      <!-- Radar Center (Input) -->
      <div class="radar-core">
          <div class="radar-waves">
              <div class="wave w1"></div>
              <div class="wave w2"></div>
              <div class="wave w3"></div>
          </div>
          
          <div class="soul-input-glass">
               <input type="text" id="soul-input" placeholder="Send a signal... (e.g. 'I love jazz')" autocomplete="off">
               <button id="btn-scan" onclick="startScanning()">
                   <i class="fas fa-search-location"></i>
               </button>
          </div>
      </div>

      <!-- Detected Agents (Injected by JS) -->
      <div id="radar-field">
          <!-- Agents will pop up here -->
      </div>
  </div>

  <!-- Glass Modal -->
  <div id="agent-modal" class="agent-modal">
      <div class="glass-panel modal-panel">
          <button class="close-modal" onclick="closeModal()">&times;</button>
          <div class="modal-body" id="modal-body"></div>
      </div>
  </div>

  <script src="static/discovery.js?v=1764550139"></script>
</body>
</html>
