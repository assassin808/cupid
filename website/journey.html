<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Journey | Cupid</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="static/sandbox.css?v=1764549900">
    <link rel="stylesheet" href="static/journey.css?v=1764549900">
</head>
<body>

<nav class="sidebar">
    <div class="brand-box">
        <a href="/" class="app-logo">Cupid</a>
        <span class="slogan">Love First,<br>Know Later</span>
        <span class="beta-badge">BETA</span>
    </div>
    <div class="nav-menu">
        <a href="/home" class="nav-item">
            <span class="nav-icon"></span> Home
        </a>
        <a href="/discovery" class="nav-item">
            <span class="nav-icon"></span> Discovery
        </a>
        <a href="/sandbox" class="nav-item">
            <span class="nav-icon"></span> Sandbox
        </a>
    </div>
    <div class="sidebar-footer">
        <a href="/user_settings" class="nav-item">
            <span class="nav-icon"></span> Settings
        </a>
    </div>
</nav>

<div class="journey-container">
    <div class="journey-header">
        <h1>Your Love Journey</h1>
        <p id="partner-name">With <strong id="partner-display">...</strong></p>
    </div>

    <!-- Game Stage (Same as Sandbox) -->
    <div class="game-stage" id="game-stage">
        <div class="game-header">
            <span>💕 Your Agent's Story</span>
            <div class="game-score-badge">
                <span>Compatibility:</span>
                <span id="game-score-val">25</span>/50
                <span id="game-score-emoji">😊</span>
            </div>
        </div>
        <div class="game-content" id="game-content">
            <div class="system-event">
                <span class="system-badge">SYSTEM</span>
                <div class="system-text">Starting your love journey...</div>
            </div>
        </div>
    </div>

    <!-- Character Portraits -->
    <div class="character-portraits">
        <div class="char-portrait char-left">
            <div class="char-avatar-circle" id="char-avatar-left"></div>
            <div class="char-name" id="char-name-left">Partner</div>
        </div>
        <div class="char-portrait char-right">
            <div class="char-avatar-circle" id="char-avatar-right"></div>
            <div class="char-name" id="char-name-right">You</div>
        </div>
    </div>

    <!-- Calibration Panel (Key Feature) -->
    <div class="calibration-panel" id="calibration-panel" style="display:none;">
        <div class="calibration-card glass-panel">
            <h3>Does this feel like you?</h3>
            <p class="calibration-scene" id="calibration-scene-text"></p>
            <div class="calibration-actions">
                <button class="btn-calibrate like" onclick="calibrate('like')">
                    <i class="fas fa-heart"></i> This is me
                </button>
                <button class="btn-calibrate somewhat" onclick="calibrate('somewhat')">
                    <i class="fas fa-question"></i> Somewhat
                </button>
                <button class="btn-calibrate unlike" onclick="calibrate('unlike')">
                    <i class="fas fa-times"></i> Not like me
                </button>
            </div>
        </div>
    </div>
</div>

<script src="/static/socket.io.min.js"></script>
<script src="static/journey.js?v=1764549900"></script>
</body>
</html>
