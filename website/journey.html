<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Journey | Cupid</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="static/sandbox.css?v=1764550139">
    <link rel="stylesheet" href="static/journey.css?v=1764550139">
</head>
<body>
<nav class="sidebar">
    <div class="brand-box">
        <a href="/" class="app-logo">Cupid</a>
        <span class="slogan">Love First,<br>Know Later</span>
        <span class="beta-badge">BETA</span>
    </div>
    <div class="nav-menu">
        <a href="/home" class="nav-item ">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Home
        </a>
        <a href="/discovery" class="nav-item ">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
            Discovery
        </a>
        <a href="/sandbox" class="nav-item ">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
            Sandbox
        </a>
    </div>
    <div class="sidebar-footer">
        <a href="/user_settings" class="nav-item ">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            Settings
        </a>
    </div>
</nav>




<div class="journey-container">
    <div class="journey-header">
        <h1>Your Love Journey</h1>
        <p id="partner-name">With <strong id="partner-display">...</strong></p>
    </div>

    <!-- Game Stage (Same as Sandbox) -->
    <div class="game-stage" id="game-stage">
        <div class="game-header">
            <span>💕 Your Agent's Story</span>
            <div class="game-score-badge">
                <span>Compatibility:</span>
                <span id="game-score-val">25</span>/50
                <span id="game-score-emoji">😊</span>
            </div>
        </div>
        <div class="game-content" id="game-content">
            <div class="system-event">
                <span class="system-badge">SYSTEM</span>
                <div class="system-text">Starting your love journey...</div>
            </div>
        </div>
    </div>

    <!-- Character Portraits -->
    <div class="character-portraits">
        <div class="char-portrait char-left">
            <div class="char-avatar-circle" id="char-avatar-left"></div>
            <div class="char-name" id="char-name-left">Partner</div>
        </div>
        <div class="char-portrait char-right">
            <div class="char-avatar-circle" id="char-avatar-right"></div>
            <div class="char-name" id="char-name-right">You</div>
        </div>
    </div>

    <!-- Calibration Panel (Key Feature) -->
    <div class="calibration-panel" id="calibration-panel" style="display:none;">
        <div class="calibration-card glass-panel">
            <h3>Does this feel like you?</h3>
            <p class="calibration-scene" id="calibration-scene-text"></p>
            <div class="calibration-actions">
                <button class="btn-calibrate like" onclick="calibrate('like')">
                    <i class="fas fa-heart"></i> This is me
                </button>
                <button class="btn-calibrate somewhat" onclick="calibrate('somewhat')">
                    <i class="fas fa-question"></i> Somewhat
                </button>
                <button class="btn-calibrate unlike" onclick="calibrate('unlike')">
                    <i class="fas fa-times"></i> Not like me
                </button>
            </div>
        </div>
    </div>
</div>

<script src="/static/socket.io.min.js"></script>
<script src="static/journey.js?v=1764550139"></script>
</body>
</html>
